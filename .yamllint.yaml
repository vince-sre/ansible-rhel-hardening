extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  indentation:
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
ignore: |
  .terraform/
  **/templates/
  node_modules/
  collections/
  .cache/
