- name: Set password ageing defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ os_baseline_password_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ os_baseline_password_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ os_baseline_password_warn_age }}" }
    - { key: UMASK, value: "{{ os_baseline_umask }}" }
  loop_control:
    label: "{{ item.key }}"

- name: Configure password quality
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/50-cis.conf
    owner: root
    group: root
    mode: "0644"

- name: Configure account lockout
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable faillock in the authselect profile
  ansible.builtin.command: authselect enable-feature with-faillock
  register: os_baseline_authselect
  changed_when: "'already enabled' not in (os_baseline_authselect.stdout + os_baseline_authselect.stderr)"
  failed_when: os_baseline_authselect.rc not in [0, 1]

- name: Restrict su to the wheel group
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?auth\s+required\s+pam_wheel.so'
    line: "auth            required        pam_wheel.so use_uid"
